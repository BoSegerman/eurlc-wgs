name: eurlc-wgs-sistr
channels:
  # conda-forge before bioconda, and never the Anaconda defaults channel
  # (licence terms, and mixing it with conda-forge breaks solves) (B18).
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - sistr_cmd=1.1.3
  # sistr_cmd 1.1.3 imports pkg_resources, which setuptools removed in v81
  # (sistr failed with "No module named 'pkg_resources'", Nov 2026).
  # Remove this pin when sistr_cmd is upgraded -- test without it first.
  - setuptools<81
